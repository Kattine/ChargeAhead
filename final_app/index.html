function chart(rows,series){const values=rows.flatMap(r=>series.map(s=>r[s[0]])).filter(v=>v!=null&&Number.isFinite(v));if(!values.length)return '<p>No observations</p>';let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo||1)*.12;lo-=pad;hi+=pad;const x=i=>70+800*i/Math.max(rows.length-1,1),y=v=>260-(v-lo)*220/(hi-lo);let s='<svg viewBox="0 0 920 310" role="img" aria-label="Historical time series">';for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4;s+=`<line x1="70" x2="870" y1="${y(v)}" y2="${y(v)}" stroke="#dde7e6"/><text x="60" y="${y(v)+4}" text-anchor="end" fill="#536e77" font-size="12">${f(v,1)}</text>`}for(const [key,label,color] of series){let path='',open=false;rows.forEach((r,i)=>{if(r[key]==null){open=false;return}path+=(open?'L':'M')+x(i)+' '+y(r[key])+' ';open=true});s+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="3"/>`}rows.forEach((r,i)=>{if(i%Math.ceil(rows.length/7)===0||i===rows.length-1)s+=`<text x="${x(i)}" y="290" text-anchor="middle" font-size="12" fill="#536e77">${r.month.slice(0,7)}</text>`});return s+'</svg><div class="legend">'+series.map(a=>`<span style="color:${a[2]}">● ${a[1]}</span>`).join('')+'</div>'}

const last=D.market.at(-1);document.querySelector('#market').innerHTML=`<h2>A larger share is not always more sales</h2><p class="muted">Market composition and volume, shown separately.</p><div class="grid">${card('Market coverage','44 months','January 2023–August 2026')}${card('Latest NEV retail share',pc(last.nev_share),'Calculated from retail counts')}${card('Latest NEV retail volume',f(last.nev_retail_wan,1),'Ten thousand vehicles')}</div>`+plot('NEV retail share (%)',D.market.map(r=>({...r,v:r.nev_share*100})),[['v','Share of total retail','#087f8c']])+plot('Retail volumes (ten thousand vehicles)',D.market,[['retail_wan','Total passenger-car retail','#122d38'],['nev_retail_wan','NEV retail','#087f8c']])+`<details><summary>Original Transition Index: inspect the other three components</summary><p>This legacy composite used changing coverage and full-sample scaling. Keep each raw component in its own unit. Missing values remain missing, and retail differs from wholesale.</p>`+plot('ICE retail decline, year over year (%)',D.market.map(r=>({...r,v:r.ice_yoy_calculated==null?null:-r.ice_yoy_calculated*100})),[['v','Positive = decline','#a46b30']])+plot('BEV share within NEV wholesale (%)',D.market.map(r=>({...r,v:r.bev_share_of_nev==null?null:r.bev_share_of_nev*100})),[['v','BEV share','#087f8c']])+plot('A0 + A share within BEV mix (%)',D.market.map(r=>({...r,v:r.bev_mix_a0==null||r.bev_mix_a==null?null:100*(r.bev_mix_a0+r.bev_mix_a)})),[['v','A0 + A share','#087f8c']])+'</details>';

const brands=[...new Map(D.brands.map(r=>[r.brand_id,r.brand])).entries()];document.querySelector('#brand').innerHTML=`<h2>Does attention lead relative brand performance?</h2><p class="muted">Fixed six-brand sample • NEV wholesale, including exports • 20 months of input data</p><label for="brandSelect">Explore a brand </label><select id="brandSelect">${brands.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select><div id="brandChart"></div><div class="grid">${card('Pooled MAE reduction',pc(D.summary.relative_mae_gain),'Versus the same history-only model')}${card('Brands with lower MAE',D.summary.brands_improved+' / 6','Same eight evaluation months')}${card('Practical success gate','Not met','Required ≥5% gain and ≥4 brands')}</div><p class="notice">The gain is small. A zero-growth relative baseline beats both regressions on MAE. Adding one more month of delay removes the search edge.</p><h3>Overall test: January–August 2026, 48 brand-month observations</h3>`+table(D.metrics)+`<details><summary>Extra-month delay sensitivity</summary>${table(D.delay)}</details><details open><summary>Definitions, coverage and limits</summary><p>Relative growth is monthly log growth minus the fixed six-brand average. Units are log percentage points, so they are not comparable to national share-change units. The chart aligns prior-month search with current-month sales and is descriptive only.</p><p>Training expands month by month, with full months kept together across brands. The rule was documented before this run, but related tests were discussed earlier. This remains exploratory.</p><p>All brands use total NEV wholesale. Export coverage is incomplete (including Leapmotor in 2025), and missing export entries are not set to zero. This is not a domestic-retail demand measure. Search can reflect news interest, and manufacturer scope may differ from brand scope.</p></details><button id="download">Download selected brand CSV</button>`;
