<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChargeAhead</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#122d38;font:16px system-ui}header{padding:35px 6%;background:#122d38;color:white}header small{color:#cbea57;letter-spacing:2px}h1{font-size:44px;margin:10px 0}main{max-width:1150px;margin:25px auto;padding:0 20px}button,select{padding:12px 18px;font:inherit;background:white;border:1px solid #bfd1d3;border-radius:8px;cursor:pointer;color:#122d38}button[aria-selected=true]{background:#087f8c;color:white}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}h2{font-size:30px}p{line-height:1.65}.muted{color:#536e77}.plot,.card,.table{background:white;padding:22px;border:1px solid #d9e5e4;border-radius:12px;margin:18px 0}.plot svg{width:100%;height:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card strong{font-size:32px;display:block;margin:10px 0}.notice{background:#e2efed;border-left:5px solid #087f8c;padding:18px 22px;line-height:1.6}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid #e1e8e8}th{font-size:13px;color:#526b75}.table{overflow:auto}details{margin:25px 0;line-height:1.7}footer{font-size:13px;color:#536e77;margin:35px 0;border-top:1px solid #cad8d8;padding-top:20px}section[hidden]{display:none}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style><header><small>CHINA / AUTOMOTIVE TRANSITION</small><h1>ChargeAhead</h1><p>Market trends and search signals, in one place.</p></header><main><nav role="tablist"><button data-tab="market" aria-selected="true">01 Market transition</button><button data-tab="national" aria-selected="false">02 National test</button><button data-tab="brand" aria-selected="false">03 Brand explorer</button></nav><section id="market"></section><section id="national" hidden></section><section id="brand" hidden></section><footer>Research snapshot • Market data through August 2026 • Final project, November 2026.<br>CPCA/Baidu workbook extracts.  No investment advice.</footer></main><script>
const D=__DATA__;const f=(n,d=2)=>n==null?'Unavailable':Number(n).toFixed(d);const pc=n=>n==null?'No call':f(n*100,1)+'%';
function chart(rows,series){const values=rows.flatMap(r=>series.map(s=>r[s[0]])).filter(v=>v!=null&&Number.isFinite(v));if(!values.length)return '<p>No observations</p>';let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo||1)*.12;lo-=pad;hi+=pad;const x=i=>70+800*i/Math.max(rows.length-1,1),y=v=>260-(v-lo)*220/(hi-lo);let s='<svg viewBox="0 0 920 310" role="img" aria-label="Historical time series">';for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4;s+=`<line x1="70" x2="870" y1="${y(v)}" y2="${y(v)}" stroke="#dde7e6"/><text x="60" y="${y(v)+4}" text-anchor="end" fill="#536e77" font-size="12">${f(v,1)}</text>`}for(const [key,label,color] of series){let path='',open=false;rows.forEach((r,i)=>{if(r[key]==null){open=false;return}path+=(open?'L':'M')+x(i)+' '+y(r[key])+' ';open=true});s+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="3"/>`}rows.forEach((r,i)=>{if(i%Math.ceil(rows.length/7)===0||i===rows.length-1)s+=`<text x="${x(i)}" y="290" text-anchor="middle" font-size="12" fill="#536e77">${r.month.slice(0,7)}</text>`});return s+'</svg><div class="legend">'+series.map(a=>`<span style="color:${a[2]}">● ${a[1]}</span>`).join('')+'</div>'}
function table(rows){return '<div class="table"><table><tr><th>Method</th><th>MAE ↓</th><th>RMSE ↓</th><th>Direction accuracy</th></tr>'+rows.map(r=>`<tr><td>${r.model}</td><td>${f(r.mae??r.mae_pp)}</td><td>${f(r.rmse??r.rmse_pp)}</td><td>${pc(r.direction_accuracy)}</td></tr>`).join('')+'</table></div>'}const plot=(title,rows,series)=>`<div class="plot"><h3>${title}</h3>${chart(rows,series)}</div>`;const card=(label,value,note)=>`<div class="card">${label}<strong>${value}</strong>${note}</div>`;
const last=D.market.at(-1);document.querySelector('#market').innerHTML=`<h2>A larger share is not always more sales</h2><p class="muted">Market composition and volume, shown separately.</p><div class="grid">${card('Market coverage','44 months','January 2023–August 2026')}${card('Latest NEV retail share',pc(last.nev_share),'Calculated from retail counts')}${card('Latest NEV retail volume',f(last.nev_retail_wan,1),'Ten thousand vehicles')}</div>`+plot('NEV retail share (%)',D.market.map(r=>({...r,v:r.nev_share*100})),[['v','Share of total retail','#087f8c']])+plot('Retail volumes (ten thousand vehicles)',D.market,[['retail_wan','Total passenger-car retail','#122d38'],['nev_retail_wan','NEV retail','#087f8c']])+`<details><summary>Original Transition Index: inspect the other three components</summary><p>This legacy composite used changing coverage and full-sample scaling. Keep each raw component in its own unit. Missing values remain missing, and retail differs from wholesale.</p>`+plot('ICE retail decline, year over year (%)',D.market.map(r=>({...r,v:r.ice_yoy_calculated==null?null:-r.ice_yoy_calculated*100})),[['v','Positive = decline','#a46b30']])+plot('BEV share within NEV wholesale (%)',D.market.map(r=>({...r,v:r.bev_share_of_nev==null?null:r.bev_share_of_nev*100})),[['v','BEV share','#087f8c']])+plot('A0 + A share within BEV mix (%)',D.market.map(r=>({...r,v:r.bev_mix_a0==null||r.bev_mix_a==null?null:100*(r.bev_mix_a0+r.bev_mix_a)})),[['v','A0 + A share','#087f8c']])+'</details>';
document.querySelector('#national').innerHTML=`<h2>Search did not reduce national forecast error</h2><p class="muted">Monthly change in NEV retail share • Same 18 test months: March 2025–August 2026</p><div class="grid">${card('History-only MAE','3.223','Percentage points')}${card('History + search MAE','3.233','Percentage points')}${card('Direction, both models','12 / 18','Correct monthly directions')}</div><p class="notice">With these two terms and this model, search did not improve error. Simple historical baselines are still competitive.</p>`+table(D.national)+`<details open><summary>Protocol and interpretation</summary><p>Each month is refit using only earlier data, with training-only scaling. Search input is the month-to-month change in average attention to 新能源汽车 and 新能源车. We assume prior-month reports are available at forecast time. Release-vintage history is not verified.</p><p>No-change makes no direction call. An always-up rule also gets 14/18 right. Treat this as retrospective evidence.</p></details>`;
const brands=[...new Map(D.brands.map(r=>[r.brand_id,r.brand])).entries()];document.querySelector('#brand').innerHTML=`<h2>Does attention lead relative brand performance?</h2><p class="muted">Fixed six-brand sample • NEV wholesale, including exports • 20 months of input data</p><label for="brandSelect">Explore a brand </label><select id="brandSelect">${brands.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select><div id="brandChart"></div><div class="grid">${card('Pooled MAE reduction',pc(D.summary.relative_mae_gain),'Versus the same history-only model')}${card('Brands with lower MAE',D.summary.brands_improved+' / 6','Same eight evaluation months')}${card('Practical success gate','Not met','Required ≥5% gain and ≥4 brands')}</div><p class="notice">The gain is small. A zero-growth relative baseline beats both regressions on MAE. Adding one more month of delay removes the search edge.</p><h3>Overall test: January–August 2026, 48 brand-month observations</h3>`+table(D.metrics)+`<details><summary>Extra-month delay sensitivity</summary>${table(D.delay)}</details><details open><summary>Definitions, coverage and limits</summary><p>Relative growth is monthly log growth minus the fixed six-brand average. Units are log percentage points, so they are not comparable to national share-change units. The chart aligns prior-month search with current-month sales and is descriptive only.</p><p>Training expands month by month, with full months kept together across brands. The rule was documented before this run, but related tests were discussed earlier. This remains exploratory.</p><p>All brands use total NEV wholesale. Export coverage is incomplete (including Leapmotor in 2025), and missing export entries are not set to zero. This is not a domestic-retail demand measure. Search can reflect news interest, and manufacturer scope may differ from brand scope.</p></details><button id="download">Download selected brand CSV</button>`;
function showBrand(){let rows=D.brands.filter(r=>r.brand_id===document.querySelector('#brandSelect').value);document.querySelector('#brandChart').innerHTML=plot(rows[0].brand+': relative monthly log growth',rows,[['search_lag1','Previous-month search','#a46b30'],['sales_relative','Current-month wholesale','#087f8c']])}showBrand();document.querySelector('#brandSelect').onchange=showBrand;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'))});document.querySelector('#download').onclick=()=>{let r=D.brands.filter(x=>x.brand_id===document.querySelector('#brandSelect').value),k=['brand','month','nev_wholesale_units','attention','sales_relative','search_lag1'],csv=k.join(',')+'\n'+r.map(x=>k.map(a=>x[a]??'').join(',')).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=r[0].brand_id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
